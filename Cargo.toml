[workspace]
members = ["crates/vdesk", "crates/vdesk-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.4.3"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "timeout"] }
uuid = { version = "1.26", features = ["serde", "v4"] }
x11rb = { version = "0.14.0", features = ["randr", "shm", "xfixes", "xtest"] }

[profile.release]
lto = "thin"
strip = "symbols"
